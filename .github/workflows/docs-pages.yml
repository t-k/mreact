name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs-pages.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - typedoc.json
      - api-extractor.json
      - docs/api/**
      - benchmarks/results/**
      - examples/docs-site/**
      - packages/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @reckona/example-docs-site build
        env:
          MREACT_DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: examples/docs-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
