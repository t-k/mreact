name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-24-pnpm-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - parallel:
          - name: Lint
            run: pnpm lint

          - name: Typecheck examples
            run: pnpm typecheck:examples

          - name: Install Playwright Chromium
            run: pnpm exec playwright install --with-deps chromium

          - name: Format
            run: pnpm format

      - parallel:
          - name: Test router client build
            run: pnpm exec vitest run packages/router/test/client-build.test.ts --passWithNoTests --maxWorkers=1 --maxConcurrency=1

          - name: Typecheck package tests
            run: node scripts/typecheck-package-tests.mjs

          - name: E2E smoke
            run: pnpm exec playwright test packages/router/e2e/navigation.spec.ts --grep "client navigation preserves layouts"

          - name: API reports
            run: node scripts/generate-api-reports.mjs --check

          - name: API reference
            run: pnpm docs:api:check

          - name: Test router build
            run: pnpm exec vitest run packages/router/test/build.test.ts --passWithNoTests --maxWorkers=1 --maxConcurrency=1

  test-shard:
    name: Test shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test shard
        run: pnpm exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/3 --exclude packages/router/test/build.test.ts --exclude packages/router/test/client-build.test.ts

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: nextest@0.9.143

      - name: Install cargo-deny
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-deny@0.18.7

      - name: Lint native crate
        run: cargo clippy --manifest-path packages/router-native/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test native crate
        run: cargo nextest run --manifest-path packages/router-native/Cargo.toml --locked --no-default-features

      - name: Test Rust documentation
        run: cargo test --manifest-path packages/router-native/Cargo.toml --locked --doc --no-default-features

      - name: Check dependency policy
        run: |
          cargo deny --manifest-path packages/router-native/Cargo.toml --config packages/router-native/deny.toml check bans licenses sources
          cargo deny --manifest-path packages/router-native/fuzz/Cargo.toml --config packages/router-native/deny.toml check bans licenses sources

      - name: Check RustSec advisories
        run: |
          cargo deny --manifest-path packages/router-native/Cargo.toml --config packages/router-native/deny.toml check advisories
          cargo deny --manifest-path packages/router-native/fuzz/Cargo.toml --config packages/router-native/deny.toml check advisories

  native-artifacts:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: router-native-linux-x64-gnu
            binary: index.node
            rustflags: ""
          - os: macos-14
            package: router-native-darwin-arm64
            binary: index.node
            rustflags: "-C link-arg=-undefined -C link-arg=dynamic_lookup"
          - os: windows-latest
            package: router-native-win32-x64-msvc
            binary: index.node
            rustflags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native addon
        run: pnpm --dir packages/router-native build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
