name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish
        required: true
        default: latest
      dry_run:
        description: Run npm publish with --dry-run
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm exec vitest run --passWithNoTests --maxWorkers=1 --maxConcurrency=1

      - name: Format
        run: pnpm format

      - name: API reports
        run: pnpm api:report:check

      - name: API reference
        run: pnpm docs:api:check

  native-artifacts:
    name: Native artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: router-native-linux-x64-gnu
            rustflags: ""
          - os: macos-14
            package: router-native-darwin-arm64
            rustflags: "-C link-arg=-undefined -C link-arg=dynamic_lookup"
          - os: windows-latest
            package: router-native-win32-x64-msvc
            rustflags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: pnpm --dir packages/router-native build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Stage platform package binary
        shell: bash
        run: cp packages/router-native/index.node "packages/${{ matrix.package }}/index.node"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/index.node
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs:
      - verify
      - native-artifacts
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Linux native artifact
        uses: actions/download-artifact@v8
        with:
          name: router-native-linux-x64-gnu
          path: packages/router-native-linux-x64-gnu

      - name: Download macOS native artifact
        uses: actions/download-artifact@v8
        with:
          name: router-native-darwin-arm64
          path: packages/router-native-darwin-arm64

      - name: Download Windows native artifact
        uses: actions/download-artifact@v8
        with:
          name: router-native-win32-x64-msvc
          path: packages/router-native-win32-x64-msvc

      - name: Build packages
        run: pnpm build

      - name: Verify native packages
        run: node scripts/verify-native-packages.mjs

      - name: Publish packages
        run: |
          npm_tag="${{ inputs.tag }}"
          if [ -z "$npm_tag" ]; then
            npm_tag="latest"
          fi

          args=(--tag "$npm_tag")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run --skip-existing-check)
          fi
          node scripts/publish-packages.mjs "${args[@]}"
