name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish
        required: true
        default: latest
      dry_run:
        description: Run npm publish with --dry-run
        type: boolean
        required: true
        default: true
      disable_provenance:
        description: Disable npm provenance for recovery when Sigstore/Rekor rejects a retry
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Lint
            run: pnpm lint

          - name: Build
            run: pnpm build

          - name: Install Playwright Chromium
            run: pnpm exec playwright install --with-deps chromium

          - name: Format
            run: pnpm format

      - parallel:
          - name: Test router client build
            run: pnpm exec vitest run packages/router/test/client-build.test.ts --passWithNoTests --maxWorkers=1 --maxConcurrency=1

          - name: API reports
            run: node scripts/generate-api-reports.mjs --check

          - name: API reference
            run: |
              pnpm exec typedoc --options typedoc.json
              git diff --exit-code -- docs/api

          - name: Test router build
            run: pnpm exec vitest run packages/router/test/build.test.ts --passWithNoTests --maxWorkers=1 --maxConcurrency=1

      - name: Standalone tarball smoke
        run: pnpm publish:standalone-smoke

  smoke-min-node:
    name: Standalone tarball smoke (Node 20.19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Minimum engines.node from package.json. Keep in sync.
          node-version: 20.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Standalone tarball smoke
        run: pnpm publish:standalone-smoke

  test-shard:
    name: Test shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test shard
        run: pnpm exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/3 --exclude packages/router/test/build.test.ts --exclude packages/router/test/client-build.test.ts

  native-artifacts:
    name: Native artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: router-native-linux-x64-gnu
            rustflags: ""
          - os: macos-14
            package: router-native-darwin-arm64
            rustflags: "-C link-arg=-undefined -C link-arg=dynamic_lookup"
          - os: windows-latest
            package: router-native-win32-x64-msvc
            rustflags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native addon
        run: pnpm --dir packages/router-native build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Stage platform package binary
        shell: bash
        run: cp packages/router-native/index.node "packages/${{ matrix.package }}/index.node"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/index.node
          retention-days: 1

  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs:
      - verify
      - smoke-min-node
      - test-shard
      - native-artifacts
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Download Linux native artifact
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: router-native-linux-x64-gnu
              path: packages/router-native-linux-x64-gnu

          - name: Download macOS native artifact
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: router-native-darwin-arm64
              path: packages/router-native-darwin-arm64

          - name: Download Windows native artifact
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: router-native-win32-x64-msvc
              path: packages/router-native-win32-x64-msvc

      - name: Build packages
        run: pnpm build

      - name: Verify native packages
        run: node scripts/verify-native-packages.mjs

      - name: Publish packages
        env:
          NPM_DIST_TAG: ${{ inputs.tag }}
          NPM_DRY_RUN: ${{ inputs.dry_run }}
          NPM_DISABLE_PROVENANCE: ${{ inputs.disable_provenance }}
        run: |
          if [ "$NPM_DISABLE_PROVENANCE" = "true" ]; then
            export NPM_CONFIG_PROVENANCE=false
          fi

          npm_tag="$NPM_DIST_TAG"
          if [ -z "$npm_tag" ]; then
            # Tag pushes have no dist-tag input. Prerelease tags such as
            # v1.2.3-rc.1 must never land on `latest`, so route them to `next`.
            case "${GITHUB_REF_NAME}" in
              v*-*) npm_tag="next" ;;
              *) npm_tag="latest" ;;
            esac
          fi
          if [[ ! "$npm_tag" =~ ^[a-zA-Z][a-zA-Z0-9._-]*$ ]]; then
            echo "Invalid npm dist-tag." >&2
            exit 1
          fi
          echo "Publishing with npm dist-tag: ${npm_tag}"

          args=(--tag "$npm_tag")
          if [ "$NPM_DRY_RUN" = "true" ]; then
            args+=(--dry-run --skip-existing-check)
          fi
          node scripts/publish-packages.mjs "${args[@]}"
