name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        type: choice
        default: all
        options:
          - all
          - primitive
          - primitive-browser
          - non-router
          - router

permissions:
  actions: write
  contents: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare benchmark output directory
        id: results
        shell: bash
        run: |
          run_date="$(date -u +%F)"
          day_dir="benchmarks/results/$run_date"
          mkdir -p "$day_dir"
          result_dir=""
          for index in $(seq -f "%03g" 1 999); do
            candidate="$day_dir/$index"
            if mkdir "$candidate" 2>/dev/null; then
              result_dir="$candidate"
              echo "dir=$result_dir" >> "$GITHUB_OUTPUT"
              echo "date=$run_date" >> "$GITHUB_OUTPUT"
              echo "run=$index" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ -z "$result_dir" ]; then
            echo "No benchmark result run slots remain for $run_date." >&2
            exit 1
          fi

      - name: Install Playwright Chromium
        if: ${{ inputs.suite == 'all' || inputs.suite == 'primitive-browser' || inputs.suite == 'router' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Linux native addon
        if: ${{ inputs.suite == 'all' || inputs.suite == 'router' }}
        run: pnpm --dir packages/router-native build

      - name: Run primitive benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'primitive' }}
        env:
          MREACT_BENCHMARK_RESULTS_DIR: ${{ steps.results.outputs.dir }}
        run: NODE_ENV=production pnpm bench:primitive

      - name: Run primitive browser benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'primitive-browser' }}
        env:
          MREACT_BENCHMARK_RESULTS_DIR: ${{ steps.results.outputs.dir }}
        run: NODE_ENV=production pnpm bench:primitive-browser

      - name: Run non-router benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'non-router' }}
        env:
          MREACT_NON_ROUTER_BENCH_OUT: ${{ steps.results.outputs.dir }}/non-router.md
        run: NODE_ENV=production pnpm bench:non-router

      - name: Run router benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'router' }}
        env:
          MREACT_BENCHMARK_RESULTS_DIR: ${{ steps.results.outputs.dir }}
        run: NODE_ENV=production pnpm bench:router

      - name: Write benchmark summary
        shell: bash
        run: |
          files=()
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "primitive" ]; then
            files+=("${{ steps.results.outputs.dir }}/primitive.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "primitive-browser" ]; then
            files+=("${{ steps.results.outputs.dir }}/primitive-browser.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "non-router" ]; then
            files+=("${{ steps.results.outputs.dir }}/non-router.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "router" ]; then
            files+=("${{ steps.results.outputs.dir }}/router.md")
          fi
          {
            echo "# Benchmark Results"
            echo
            echo "- Suite: \`${{ inputs.suite }}\`"
            echo "- Result directory: \`${{ steps.results.outputs.dir }}\`"
            for file in "${files[@]}"; do
              if [ -f "$file" ]; then
                echo
                awk '/^## Results$/ { exit } { print }' "$file"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit benchmark results
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmarks/results
          if git diff --cached --quiet; then
            echo "No benchmark result changes to commit."
            exit 0
          fi
          git commit -m "Update benchmark results (${{ inputs.suite }}, ${{ steps.results.outputs.date }})"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run docs-pages.yml --ref "$GITHUB_REF_NAME"
