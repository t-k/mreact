name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        type: choice
        default: all
        options:
          - all
          - primitive
          - router

permissions:
  contents: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare benchmark output directory
        shell: bash
        run: |
          mkdir -p benchmarks/results

      - name: Install Playwright Chromium
        if: ${{ inputs.suite == 'all' || inputs.suite == 'router' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Linux native addon
        if: ${{ inputs.suite == 'all' || inputs.suite == 'router' }}
        run: pnpm --dir packages/router-native build

      - name: Run primitive benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'primitive' }}
        run: NODE_ENV=production pnpm bench:primitive

      - name: Run router benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'router' }}
        run: NODE_ENV=production pnpm bench:router

      - name: Locate benchmark results
        id: results
        shell: bash
        run: |
          result_dir="$(find benchmarks/results -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          if [ -z "$result_dir" ]; then
            echo "No benchmark result directory was produced." >&2
            exit 1
          fi
          echo "dir=$result_dir" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$result_dir")" >> "$GITHUB_OUTPUT"

      - name: Write benchmark summary
        shell: bash
        run: |
          files=()
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "primitive" ]; then
            files+=("${{ steps.results.outputs.dir }}/primitive.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "router" ]; then
            files+=("${{ steps.results.outputs.dir }}/router.md")
          fi
          {
            echo "# Benchmark Results"
            echo
            echo "- Suite: \`${{ inputs.suite }}\`"
            echo "- Result directory: \`${{ steps.results.outputs.dir }}\`"
            for file in "${files[@]}"; do
              if [ -f "$file" ]; then
                echo
                awk '/^## Results$/ { exit } { print }' "$file"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit benchmark results
        if: ${{ github.ref_type == 'branch' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results
          if git diff --cached --quiet; then
            echo "No benchmark result changes to commit."
            exit 0
          fi
          git commit -m "Update benchmark results (${{ inputs.suite }}, ${{ steps.results.outputs.date }})"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
