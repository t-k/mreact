name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        type: choice
        default: all
        options:
          - all
          - primitive
          - primitive-browser
          - js-framework
          - non-router
          - router
      js_frameworks:
        description: Optional js-framework-benchmark framework ids, for example "keyed/mreact keyed/mreact-react-compat keyed/react-hooks"
        required: false
        type: string
      js_benchmarks:
        description: Optional js-framework-benchmark ids, for example "01_run1k 03_update10th1k_x16 04_select1k 05_swap1k 07_create10k"
        required: false
        type: string
      compare_ref:
        description: Optional baseline ref for a keyed-list ABBA comparison
        required: false
        type: string
      compare_framework:
        description: Framework id for an ABBA comparison
        required: false
        type: string
        default: keyed/mreact-react-compat

permissions:
  actions: write
  contents: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: ${{ inputs.compare_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@10.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare benchmark output directory
        id: results
        shell: bash
        run: |
          run_date="$(date -u +%F)"
          day_dir="benchmarks/results/$run_date"
          mkdir -p "$day_dir"
          result_dir=""
          for index in $(seq -f "%03g" 1 999); do
            candidate="$day_dir/$index"
            if mkdir "$candidate" 2>/dev/null; then
              result_dir="$candidate"
              echo "dir=$result_dir" >> "$GITHUB_OUTPUT"
              echo "date=$run_date" >> "$GITHUB_OUTPUT"
              echo "run=$index" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ -z "$result_dir" ]; then
            echo "No benchmark result run slots remain for $run_date." >&2
            exit 1
          fi

      - name: Install Playwright Chromium
        if: ${{ inputs.suite == 'all' || inputs.suite == 'primitive-browser' || inputs.suite == 'js-framework' || inputs.suite == 'router' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve hosted Chrome
        if: ${{ inputs.suite == 'all' || inputs.suite == 'js-framework' }}
        shell: bash
        run: |
          chrome_binary="$(command -v google-chrome)"
          test -x "$chrome_binary"
          echo "MREACT_JS_FRAMEWORK_CHROME_BINARY=$chrome_binary" >> "$GITHUB_ENV"

      - name: Build Linux native addon
        if: ${{ inputs.suite == 'all' || inputs.suite == 'router' }}
        run: pnpm --dir packages/router-native build

      - name: Run primitive benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'primitive' }}
        env:
          MREACT_BENCHMARK_RESULTS_DIR: ${{ steps.results.outputs.dir }}
          BENCH_CASES: ${{ inputs.suite == 'all' && 'source write with subscriber 1k,text binding update 1k,computed fan-out 1k,computed fan-in 1k,source write 1k,keyed reverse 1k rows,create 1k event targets,repeated create update clear memory' || '' }}
        run: NODE_ENV=production pnpm bench:primitive

      - name: Run primitive browser benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'primitive-browser' }}
        env:
          MREACT_BENCHMARK_RESULTS_DIR: ${{ steps.results.outputs.dir }}
        run: NODE_ENV=production pnpm bench:primitive-browser

      - name: Run js-framework-benchmark keyed DOM benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'js-framework' }}
        env:
          MREACT_BENCHMARK_RESULTS_DIR: ${{ steps.results.outputs.dir }}
          MREACT_JS_FRAMEWORKS: ${{ inputs.js_frameworks }}
          MREACT_JS_FRAMEWORK_BENCHMARKS: ${{ inputs.js_benchmarks }}
        run: NODE_ENV=production pnpm bench:js-framework

      - name: Run non-router benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'non-router' }}
        env:
          MREACT_NON_ROUTER_BENCH_OUT: ${{ steps.results.outputs.dir }}/non-router.md
        run: NODE_ENV=production pnpm bench:non-router

      - name: Run router benchmarks
        if: ${{ inputs.suite == 'all' || inputs.suite == 'router' }}
        env:
          MREACT_BENCHMARK_RESULTS_DIR: ${{ steps.results.outputs.dir }}
        run: NODE_ENV=production pnpm bench:router

      - name: Write benchmark summary
        shell: bash
        run: |
          files=()
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "primitive" ]; then
            files+=("${{ steps.results.outputs.dir }}/primitive.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "primitive-browser" ]; then
            files+=("${{ steps.results.outputs.dir }}/primitive-browser.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "js-framework" ]; then
            files+=("${{ steps.results.outputs.dir }}/js-framework-benchmark.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "non-router" ]; then
            files+=("${{ steps.results.outputs.dir }}/non-router.md")
          fi
          if [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "router" ]; then
            files+=("${{ steps.results.outputs.dir }}/router.md")
          fi
          {
            echo "# Benchmark Results"
            echo
            echo "- Suite: \`${{ inputs.suite }}\`"
            echo "- Result directory: \`${{ steps.results.outputs.dir }}\`"
            for file in "${files[@]}"; do
              if [ -f "$file" ]; then
                echo
                awk '/^## Results$/ { exit } { print }' "$file"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.results.outputs.date }}-${{ steps.results.outputs.run }}
          path: ${{ steps.results.outputs.dir }}

      - name: Commit benchmark results
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmarks/results
          if git diff --cached --quiet; then
            echo "No benchmark result changes to commit."
            exit 0
          fi
          git commit -m "Update benchmark results (${{ inputs.suite }}, ${{ steps.results.outputs.date }})"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run docs-pages.yml --ref "$GITHUB_REF_NAME"

  compare-js-framework:
    if: ${{ inputs.compare_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.compare_ref }}
          path: baseline

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@10.19.0 --activate

      - name: Install candidate dependencies
        run: pnpm --dir candidate install --frozen-lockfile

      - name: Install baseline dependencies
        run: pnpm --dir baseline install --frozen-lockfile

      - name: Resolve hosted Chrome
        shell: bash
        run: |
          chrome_binary="$(command -v google-chrome)"
          test -x "$chrome_binary"
          echo "MREACT_JS_FRAMEWORK_CHROME_BINARY=$chrome_binary" >> "$GITHUB_ENV"

      - name: Run ABBA baseline-a candidate-a candidate-b baseline-b
        run: >-
          pnpm --dir candidate bench:js-framework:compare
          --baseline-root "$GITHUB_WORKSPACE/baseline"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
          --output "$GITHUB_WORKSPACE/candidate/benchmarks/results/compiler-keyed-comparison-${{ github.run_id }}"
          --framework "${{ inputs.compare_framework }}"
          --cases "${{ inputs.js_benchmarks }}"

      - name: Write comparison summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="$GITHUB_WORKSPACE/candidate/benchmarks/results/compiler-keyed-comparison-${{ github.run_id }}/comparison.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compiler keyed comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-keyed-comparison-${{ github.run_id }}
          path: candidate/benchmarks/results/compiler-keyed-comparison-${{ github.run_id }}
