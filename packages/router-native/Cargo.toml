[package]
name = "mreact_router_native"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/t-k/mreact"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi-bindings"]
napi-bindings = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "3.5.0", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.3.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "unbounded_depth"] }
