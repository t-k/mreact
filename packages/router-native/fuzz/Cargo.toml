[package]
name = "mreact-router-native-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mreact_router_native = { path = "..", default-features = false }
serde_json = "1.0"

[[bin]]
name = "decode_flight_base64"
path = "fuzz_targets/decode_flight_base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_flight_rows"
path = "fuzz_targets/decode_flight_rows.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
