[package]
name = "mreact-router-native-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22"
libfuzzer-sys = "0.4"
mreact_router_native = { version = "0.0.1", path = "..", default-features = false }
serde = "1.0"
serde_json = { version = "1.0", features = ["unbounded_depth"] }

[[bin]]
name = "decode_flight_base64"
path = "fuzz_targets/decode_flight_base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_flight_rows"
path = "fuzz_targets/decode_flight_rows.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
