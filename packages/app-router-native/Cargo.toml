[package]
name = "mreact_app_router_native"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.5.0", default-features = false, features = ["napi4"] }
napi-derive = "3.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "unbounded_depth"] }
